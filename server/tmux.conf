# terminalweb tmux config
# Scrollback owned by xterm.js (avoids dual-scrollback conflict)
set -g history-limit 0
# UI chrome provided by web app
set -g status off
# Mouse passthrough
set -g mouse on
# Responsive Alt/Esc sequences
set -g escape-time 10
set -g default-terminal "xterm-256color"
# TrueColor (24-bit) pass-through to the outer terminal instead of
# approximating to the 256-color palette
set -ga terminal-overrides ",*:Tc"
# No visual noise on attach
set -g set-titles off
set -g display-panes-time 300